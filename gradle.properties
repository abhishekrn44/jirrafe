org.gradle.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
# compile Kotlin inside the Gradle daemon: the separate Kotlin compile daemon talks over a loopback socket that a
# hardened machine can block, and the client then waits on it without a message
kotlin.compiler.execution.strategy=in-process
