[versions]
kotlin = "2.4.10"
kotlinx-serialization = "1.11.0"
asm = "9.10.1"
vineflower = "1.12.0"
sqlite-jdbc = "3.53.4.0"
clikt = "5.1.0"
networkanalysis = "1.3.0"
junit = "6.1.3"
mcp = "0.15.0"
ktor = "3.5.1"
slf4j = "2.0.17"
kotlinx-coroutines = "1.11.0"
kotlinx-io = "0.9.1"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
vineflower = { module = "org.vineflower:vineflower", version.ref = "vineflower" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
clikt-core = { module = "com.github.ajalt.clikt:clikt-core", version.ref = "clikt" }
networkanalysis = { module = "nl.cwts:networkanalysis", version.ref = "networkanalysis" }
mcp-server = { module = "io.modelcontextprotocol:kotlin-sdk-server", version.ref = "mcp" }
mcp-client = { module = "io.modelcontextprotocol:kotlin-sdk-client", version.ref = "mcp" }
mcp-testing = { module = "io.modelcontextprotocol:kotlin-sdk-testing", version.ref = "mcp" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
maven-publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
plugin-publish = { id = "com.gradle.plugin-publish", version = "2.1.1" }
graalvm-native = { id = "org.graalvm.buildtools.native", version = "1.1.12" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
