name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        jdk: [17, 21]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Fixture internal-lib
        run: cd jirrafe-fixtures/internal-lib && ./gradlew publish

      - name: Fixture gradle-multi
        run: cd jirrafe-fixtures/gradle-multi && ./gradlew build

      - name: Fixture maven-multi
        run: cd jirrafe-fixtures/maven-multi && ./mvnw -B -ntp package

      - name: Build and test
        run: ./gradlew build

      - name: Maven plugin
        run: cd jirrafe-maven && ./mvnw -B -ntp install

      - name: Maven resolve on fixture
        run: |
          cd jirrafe-fixtures/maven-multi
          ./mvnw -B -ntp compile io.jirrafe:jirrafe-maven-plugin:0.1.0-SNAPSHOT:resolve
          grep -q '"classification": "internal"' .jirrafe/manifest.json
          grep -q '"requested": "3.12.0"' .jirrafe/manifest.json

      - name: Index fixture end to end
        run: |
          ./gradlew :jirrafe-cli:installDist
          jirrafe-cli/build/install/jirrafe/bin/jirrafe build --full --dir jirrafe-fixtures/maven-multi
          test -s jirrafe-fixtures/maven-multi/.jirrafe/graph.json
          grep -q '## Flows' jirrafe-fixtures/maven-multi/.jirrafe/GRAPH_REPORT.md
          jirrafe-cli/build/install/jirrafe/bin/jirrafe build --dir jirrafe-fixtures/gradle-multi
          grep -q 'POST /orders' jirrafe-fixtures/gradle-multi/.jirrafe/GRAPH_REPORT.md
          jirrafe-cli/build/install/jirrafe/bin/jirrafe install --client copilot-vscode --dir jirrafe-fixtures/maven-multi
          grep -q jirrafe jirrafe-fixtures/maven-multi/.vscode/mcp.json
          jirrafe-cli/build/install/jirrafe/bin/jirrafe bench --dir jirrafe-fixtures/gradle-multi --questions jirrafe-fixtures/benchmark/gradle-multi.json | head -6
