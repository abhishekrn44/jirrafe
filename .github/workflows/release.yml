name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  jar:
    runs-on: ubuntu-latest
    env:
      # publishing steps below are skipped until these secrets exist; the GitHub release still happens
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4

      - name: Fixtures (the tests need them)
        run: |
          cd jirrafe-fixtures/internal-lib && ./gradlew -q publish
          cd ../gradle-multi && ./gradlew -q build
          cd ../maven-multi && ./mvnw -B -ntp -q package

      - name: Build, test, fat jar, distribution
        run: ./gradlew -Pversion=${GITHUB_REF_NAME#v} build :jirrafe-cli:shadowJar :jirrafe-cli:distZip

      - name: Maven plugin
        run: cd jirrafe-maven && ./mvnw -B -ntp versions:set -DnewVersion=${GITHUB_REF_NAME#v} -q && ./mvnw -B -ntp install

      - name: Benchmark numbers for the release notes
        run: |
          ./gradlew -q :jirrafe-cli:installDist
          J=jirrafe-cli/build/install/jirrafe/bin/jirrafe
          $J build --full --dir jirrafe-fixtures/gradle-multi
          $J bench --dir jirrafe-fixtures/gradle-multi --questions jirrafe-fixtures/benchmark/gradle-multi.json --output bench-gradle-multi.md
          $J build --full --dir jirrafe-fixtures/maven-multi
          $J bench --dir jirrafe-fixtures/maven-multi --questions jirrafe-fixtures/benchmark/maven-multi.json --output bench-maven-multi.md

      - name: Unversioned jar for `releases/latest/download`
        run: cp jirrafe-cli/build/libs/jirrafe-*-all.jar jirrafe-all.jar

      - name: Release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: bench-gradle-multi.md
          files: |
            jirrafe-cli/build/libs/jirrafe-*-all.jar
            jirrafe-all.jar
            jirrafe-cli/build/distributions/jirrafe-*.zip
            bench-maven-multi.md

      - name: Publish libraries to Maven Central
        if: env.MAVEN_CENTRAL_USERNAME != ''
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew -Pversion=${GITHUB_REF_NAME#v} publishToMavenCentral --no-configuration-cache

      - name: Publish the Gradle plugin to the Plugin Portal
        if: env.GRADLE_PUBLISH_KEY != ''
        env:
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew -Pversion=${GITHUB_REF_NAME#v} :jirrafe-gradle:publishPlugins -Pgradle.publish.key=$GRADLE_PUBLISH_KEY -Pgradle.publish.secret=$GRADLE_PUBLISH_SECRET

  native:
    # `jirrafe serve` as a native binary per platform; the JVM jar stays the reference distribution.
    needs: jar
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Native image
        run: ./gradlew -Pversion=${GITHUB_REF_NAME#v} :jirrafe-cli:nativeCompile
        shell: bash
      - name: Package
        shell: bash
        run: |
          cd jirrafe-cli/build/native/nativeCompile
          tar czf jirrafe-${GITHUB_REF_NAME#v}-${{ runner.os }}-${{ runner.arch }}.tar.gz jirrafe*
      - uses: softprops/action-gh-release@v2
        with:
          files: jirrafe-cli/build/native/nativeCompile/*.tar.gz
